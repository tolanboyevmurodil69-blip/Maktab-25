<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maktab portali</title>
<style>
:root{--ink:#14213d;--bg:#e9eff4;--card:#fff;--teal:#0f766e;--chalk:#f2b134;--mut:#5b6b82;--line:#d3dde6;--red:#b42318}
*{box-sizing:border-box}
body{margin:0;font:16px/1.55 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0 0 .5em;line-height:1.2}
header{background:var(--ink);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:4px solid var(--chalk)}
header b{font:700 20px Georgia,serif}
header span{opacity:.85;font-size:14px}
main{max-width:920px;margin:24px auto;padding:0 16px;display:grid;gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px}
label{display:block;font-size:14px;color:var(--mut);margin:12px 0 4px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--chalk);outline-offset:1px}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;background:var(--teal);color:#fff}
button.alt{background:#e3eaf0;color:var(--ink)}
button.bad{background:#fbe9e7;color:var(--red)}
button.sm{padding:6px 10px;font-size:14px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.login{max-width:380px;margin:12vh auto 0}
.err{color:var(--red);font-size:14px;min-height:1.4em;margin-top:8px}
.ok{background:#e6f4ef;border:1px solid #b6dccf;border-radius:8px;padding:10px 12px;margin-top:12px;font-size:15px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td.a{display:flex;gap:6px}
.post{border-left:4px solid var(--chalk);padding:4px 0 4px 12px;margin:14px 0}
.post small{color:var(--mut)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.empty{color:var(--mut)}
</style>
</head>
<body>
<header><b>Maktab portali</b><span id="who"></span></header>
<main id="app"></main>

<script>
const $=s=>document.querySelector(s);
const ROLE={admin:"Admin",teacher:"Oʻqituvchi",student:"Oʻquvchi"};
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function hash(s){
  try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("maktab:"+s));
    return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");}
  catch(e){let h=0;for(const c of "maktab:"+s)h=(h*31+c.charCodeAt(0))|0;return "f"+h;}
}
function genPass(){const c="abcdefghjkmnpqrstuvwxyz23456789";let p="";
  const r=crypto.getRandomValues(new Uint32Array(8));for(const n of r)p+=c[n%c.length];return p;}

let users=load("m_users",[]),posts=load("m_posts",[]),me=sessionStorage.getItem("m_me");

async function init(){
  if(!users.length){
    users=[{login:"admin",name:"Administrator",role:"admin",pass:await hash("admin123")}];
    save("m_users",users);
  }
  render();
}

function current(){return users.find(u=>u.login===me)}

function render(){
  const u=current(), app=$("#app");
  $("#who").innerHTML=u?`${esc(u.name)} (${ROLE[u.role]}) <button class="alt sm" onclick="logout()">Chiqish</button>`:"";
  if(!u){ me=null; return loginView(app); }
  app.innerHTML=(u.role==="admin"?adminView():"")+postsView(u);
  if(u.role==="admin") $("#np").value=genPass();
}

/* ---------- Kirish ---------- */
function loginView(app){
  app.innerHTML=`<form class="card login" onsubmit="return doLogin(event)">
    <h2>Tizimga kirish</h2>
    <p class="empty">Login va parolni maktab adminidan oling.</p>
    <label for="l">Login</label><input id="l" autocomplete="username" required>
    <label for="p">Parol</label><input id="p" type="password" autocomplete="current-password" required>
    <div class="err" id="e"></div>
    <button type="submit">Kirish</button></form>`;
}
async function doLogin(ev){
  ev.preventDefault();
  const l=$("#l").value.trim(), h=await hash($("#p").value);
  const u=users.find(x=>x.login===l&&x.pass===h);
  if(!u){$("#e").textContent="Login yoki parol notoʻgʻri.";return false;}
  me=u.login; sessionStorage.setItem("m_me",me); render(); return false;
}
function logout(){sessionStorage.removeItem("m_me");me=null;render();}

/* ---------- Admin ---------- */
function adminView(){
  const rows=users.map(u=>`<tr><td>${esc(u.name)}</td><td>${ROLE[u.role]}</td><td>${esc(u.login)}</td>
    <td class="a"><button class="alt sm" onclick="resetPass('${esc(u.login)}')">Yangi parol</button>
    ${u.login===me?"":`<button class="bad sm" onclick="delUser('${esc(u.login)}')">Oʻchirish</button>`}</td></tr>`).join("");
  return `<section class="card"><h2>Yangi akkaunt yaratish</h2>
    <div class="row">
      <div><label for="nn">Ism-familiya</label><input id="nn"></div>
      <div><label for="nr">Rol</label><select id="nr"><option value="student">Oʻquvchi</option><option value="teacher">Oʻqituvchi</option></select></div>
      <div><label for="nl">Login</label><input id="nl" autocapitalize="none"></div>
      <div><label for="np">Parol</label><input id="np"></div>
    </div>
    <div class="err" id="ae"></div>
    <button onclick="addUser()">Akkaunt yaratish</button>
    <div id="made"></div></section>
  <section class="card"><h2>Foydalanuvchilar (${users.length})</h2>
    <div class="tw"><table><tr><th>Ism</th><th>Rol</th><th>Login</th><th></th></tr>${rows}</table></div>
    <div class="tools"><button class="alt sm" onclick="backup()">Zaxira nusxa olish</button>
    <button class="alt sm" onclick="$('#imp').click()">Zaxiradan tiklash</button>
    <input id="imp" type="file" accept=".json" hidden onchange="restore(this.files[0])"></div></section>`;
}
async function addUser(){
  const name=$("#nn").value.trim(), role=$("#nr").value, login=$("#nl").value.trim().toLowerCase(), pass=$("#np").value;
  const e=$("#ae");
  if(!name||!login||pass.length<6){e.textContent="Ism, login va kamida 6 belgili parolni kiriting.";return;}
  if(users.some(u=>u.login===login)){e.textContent="Bu login band. Boshqa login tanlang.";return;}
  users.push({login,name,role,pass:await hash(pass)}); save("m_users",users);
  render();
  $("#made").innerHTML=`<div class="ok">Akkaunt yaratildi. Buni ${esc(name)}ga bering: login <b>${esc(login)}</b>, parol <b>${esc(pass)}</b>. Parol keyin koʻrsatilmaydi.</div>`;
}
async function resetPass(l){
  const p=genPass(), u=users.find(x=>x.login===l);
  u.pass=await hash(p); save("m_users",users); render();
  $("#made").innerHTML=`<div class="ok"><b>${esc(u.name)}</b> uchun yangi parol: <b>${p}</b></div>`;
}
function delUser(l){
  if(!confirm(`"${l}" akkauntini oʻchirasizmi?`))return;
  users=users.filter(u=>u.login!==l); save("m_users",users); render();
}
function backup(){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify({users,posts})],{type:"application/json"}));
  a.download="maktab-zaxira.json"; a.click();
}
function restore(f){
  if(!f)return; const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);
    if(!Array.isArray(d.users)||!d.users.some(u=>u.role==="admin"))throw 0;
    users=d.users;posts=d.posts||[];save("m_users",users);save("m_posts",posts);
    if(!current())logout();else render();
  }catch(e){alert("Fayl yaroqsiz.");}};
  r.readAsText(f);
}

/* ---------- Eʼlonlar (hamma koʻradi) ---------- */
function postsView(u){
  const form=u.role!=="student"?`<label for="pt">Yangi eʼlon</label><textarea id="pt" rows="3"></textarea>
    <div class="tools"><button onclick="addPost()">Eʼlon qoʻshish</button></div>`:"";
  const list=posts.length?posts.slice().reverse().map(p=>`<div class="post"><div>${esc(p.text).replace(/\n/g,"<br>")}</div>
    <small>${esc(p.by)} · ${esc(p.date)}</small>
    ${u.role==="admin"||p.login===u.login?` <button class="bad sm" onclick="delPost(${p.id})">Oʻchirish</button>`:""}</div>`).join("")
    :`<p class="empty">Hozircha eʼlon yoʻq.</p>`;
  return `<section class="card"><h2>Eʼlonlar</h2>${form}${list}</section>`;
}
function addPost(){
  const t=$("#pt").value.trim(); if(!t)return; const u=current();
  posts.push({id:Date.now(),login:u.login,by:u.name,text:t,date:new Date().toLocaleString("uz-UZ")});
  save("m_posts",posts); render();
}
function delPost(id){posts=posts.filter(p=>p.id!==id);save("m_posts",posts);render();}

init();
</script>
</body>
</html>
